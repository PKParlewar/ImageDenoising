# Ablation 5: Unscheduled Transport vs Physics-Calibrated Step Scheduling
model:
  in_channels: 1
  hidden_dim: 48
  n_scales: 2
  warping_window: 8
  physics_mode: "none"

ablation:
  name: "ablation_unscheduled_transport"
  description: "Standard uniform flow steps without sensor noise variance step size scaling"
  physics_mode: "none"

training:
  epochs_stage1: 10
  epochs_stage2: 15
  lr: 0.003
  lambda_mask: 1.0
  lambda_pc: 0.5
  lambda_reg: 0.01
